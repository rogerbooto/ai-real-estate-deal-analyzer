name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ensure `import src` works in CI like it does locally.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-pip-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-pip-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        # Installs from the hash-pinned lockfile, NOT the loose ranges in requirements.txt.
        # Those ranges let CI resolve crewai 1.15.11 while the developer machine sat on
        # 0.193.2, so CI and local were running different code and a green suite locally
        # meant nothing. `--require-hashes` (implied by the hashes in the lock) also makes a
        # swapped artifact fail loudly rather than silently.
        #
        # Regenerate after ANY change to requirements*.txt:
        #   uv pip compile requirements.txt requirements-dev.txt \
        #     --output-file requirements.lock --python-version 3.10 --generate-hashes
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy --config-file mypy.ini src main.py

      - name: Run tests with coverage
        run: pytest -q

      - name: Upload coverage artifact (for PR review)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
          # token: ${{ secrets.CODECOV_TOKEN }}
