[pytest]
addopts =
    -q
    --cov=src/market
    --cov=src/schemas
    --cov=src/core
    --cov=src/tools
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --cov-config=.coveragerc
testpaths = tests

# Global test settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Pytest marks (for organization)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    no_cover: disable coverage for this test (pytest-cov's own marker, registered here so a future --strict-markers run does not fail on it)
